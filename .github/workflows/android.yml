name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        run: cargo apk build --lib --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcat-debug-apk
          path: target/android-artifacts/debug/apk/*.apk
          if-no-files-found: error
